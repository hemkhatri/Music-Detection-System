<!-- Container for the video -->
<div class="video-container" onclick="loadVideo(this, '-9fMvHicwLE')">
  <!-- Placeholder Thumbnail (Max Res) -->
  <img src="https://img.youtube.com" alt="Video Thumbnail">
  
  <!-- Custom Play Button Overlay -->
  <div class="play-button"></div>
</div>

<style>
  .video-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 16 / 9;
    background-color: #000;
    cursor: pointer;
    overflow: hidden;
  }
  .video-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 48px;
    background-color: rgba(255, 0, 0, 0.9);
    border-radius: 12%;
    transition: background-color 0.3s;
  }
  .play-button::before {
    content: "";
    position: absolute;
    top: 12px;
    left: 26px;
    border-style: solid;
    border-width: 12px 0 12px 20px;
    border-color: transparent transparent transparent #fff;
  }
  .video-container:hover .play-button {
    background-color: #ff0000;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>

<script>
function loadVideo(container, videoId) {
  // Use autoplay=1 so it starts immediately after the tap
  // Use playsinline=1 to keep it on the page on mobile
  const iframe = document.createElement("iframe");
  iframe.setAttribute("src", `https://www.youtube.com{videoId}?autoplay=1&playsinline=1&rel=0`);
  iframe.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
  iframe.setAttribute("allowfullscreen", "");

  // Replace content with the iframe
  container.innerHTML = "";
  container.appendChild(iframe);
}
</script>
